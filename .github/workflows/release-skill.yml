name: Upload Skill to Releases

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  upload-skill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload always-typst.skill to release
        uses: softprops/action-gh-release@v2
        with:
          files: always-typst.skill
